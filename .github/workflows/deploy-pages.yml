name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: App checks
    uses: ./.github/workflows/app-checks.yml

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Prepare Pages files
        run: |
          site=dist/ricordo/browser
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ricordo/browser
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
