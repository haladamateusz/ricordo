<button
  #trigger
  type="button"
  class="date-picker__trigger"
  aria-haspopup="dialog"
  [id]="controlId()"
  [disabled]="disabled()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="panelId()"
  [class.date-picker__trigger--placeholder]="!value()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span>{{ displayValue() }}</span>
  <svg viewBox="0 0 24 24" fill="none" class="date-picker__icon" aria-hidden="true">
    <path
      d="M8 2.75v2.5M16 2.75v2.5M3.75 9.25h16.5M5.75 5.25h12.5A2 2 0 0 1 20.25 7.25v10A2 2 0 0 1 18.25 19.25H5.75A2 2 0 0 1 3.75 17.25v-10A2 2 0 0 1 5.75 5.25Z"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

@if (isOpen()) {
  <div
    #dialog
    [id]="panelId()"
    class="date-picker__dialog"
    role="dialog"
    [class.date-picker__dialog--years]="pickingYear()"
    [style.--calendar-width.px]="calendarWidth() || null"
    [style.--calendar-height.px]="calendarHeight() || null"
    [attr.aria-label]="pickingYear() ? chooseYearLabel() : ('date.choose' | transloco)"
  >
    @if (isCalendarReady()) {
      <calendar-date
        #calendar
        [value]="calendarDate()"
        [min]="earliestDate"
        [max]="maxDate()"
        [attr.locale]="calendarLocale()"
        first-day-of-week="1"
        show-outside-days
        (change)="selectDate($event)"
        (click)="syncVisibleYear()"
        (keyup)="syncVisibleYear()"
      >
        <svg slot="previous" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M11.78 4.47a.75.75 0 0 1 0 1.06L7.31 10l4.47 4.47a.75.75 0 1 1-1.06 1.06l-5-5a.75.75 0 0 1 0-1.06l5-5a.75.75 0 0 1 1.06 0Z"
            clip-rule="evenodd"
          />
        </svg>
        <svg slot="next" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M8.22 4.47a.75.75 0 0 1 1.06 0l5 5a.75.75 0 0 1 0 1.06l-5 5a.75.75 0 0 1-1.06-1.06L12.69 10 8.22 5.53a.75.75 0 0 1 0-1.06Z"
            clip-rule="evenodd"
          />
        </svg>
        <button
          #yearButton
          slot="heading"
          type="button"
          class="date-picker__year"
          [attr.aria-expanded]="pickingYear()"
          [attr.aria-controls]="yearsId()"
          [attr.aria-label]="chooseYearLabel()"
          (click)="toggleYears()"
        >
          {{ visibleYear() }}
        </button>
        <calendar-month [class.date-picker__month--hidden]="pickingYear()" />
      </calendar-date>
      @if (pickingYear()) {
        <div
          [id]="yearsId()"
          class="date-picker__years"
          role="group"
          [attr.aria-label]="'date.year' | transloco"
        >
          @for (year of years(); track year) {
            <button
              #yearOption
              type="button"
              class="date-picker__year-option"
              [class.date-picker__year-option--current]="year === visibleYear()"
              [class.date-picker__year-option--today]="year === todayYear()"
              [attr.data-year]="year"
              [attr.tabindex]="year === activeYear() ? 0 : -1"
              [attr.aria-current]="year === visibleYear() ? 'true' : null"
              (click)="chooseYear(year)"
              (keydown)="onYearKey($event, year)"
            >
              {{ year }}
            </button>
          }
        </div>
      }
    } @else {
      <div class="date-picker__loading" role="status">{{ 'date.loading' | transloco }}</div>
    }
  </div>
}
