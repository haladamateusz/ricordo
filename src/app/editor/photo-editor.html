<div class="editor">
  <main
    class="workspace"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div
      class="frame"
      [style.--frame-aspect]="photo() ? frameAspect() : '15 / 10'"
      [style.--frame-ratio]="photo() ? frameRatio() : 1.5"
    >
      <div class="fields">
        <div class="field">
          <label class="sr-only" for="captionDate">Date</label>
          <app-date-picker
            controlId="captionDate"
            placeholder="Select date"
            [formField]="captionForm.left"
          />
        </div>
        <div class="field">
          <label class="sr-only" for="rightCaption">Right caption</label>
          <input
            id="rightCaption"
            type="text"
            autocomplete="off"
            placeholder="Right caption"
            [formField]="captionForm.right"
          />
        </div>
      </div>

      @if (photo()) {
        <div
          class="stage"
          [class.is-dragover]="dragOver()"
          role="application"
          tabindex="0"
          [attr.aria-label]="stageLabel()"
          aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight"
          (keydown)="onPreviewKeydown($event)"
        >
          <canvas
            #preview
            aria-hidden="true"
            [style.left.%]="canvasFrame().left"
            [style.top.%]="canvasFrame().top"
            [style.width.%]="canvasFrame().width"
            [style.height.%]="canvasFrame().height"
          ></canvas>
          <div
            class="photo-overlay"
            [class.is-dragging]="dragging()"
            [style.left.%]="photoBox().x"
            [style.top.%]="photoBox().y"
            [style.width.%]="photoBox().width"
            [style.height.%]="photoBox().height"
            (pointerdown)="onPointerDown($event)"
            (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerUp()"
            (pointercancel)="onPointerUp()"
            (wheel)="onWheel($event)"
          >
            <p class="photo-name" aria-hidden="true">{{ photo()!.fileName }}</p>
            <div class="photo-actions">
              <button
                type="button"
                class="button button--secondary button--compact"
                (click)="openPicker()"
              >
                Replace
              </button>
              <button
                type="button"
                class="button button--danger button--compact"
                (click)="removePhoto()"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Remove
              </button>
            </div>
          </div>
        </div>
      } @else {
        <button
          type="button"
          class="picker"
          [class.is-dragover]="dragOver()"
          aria-describedby="photo-hint"
          (click)="openPicker()"
        >
          <span class="picker-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3.75A1.75 1.75 0 0 0 6.75 20h10.5A1.75 1.75 0 0 0 19 18.25V14.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <strong>Choose a photo</strong>
          <span id="photo-hint" class="photo-hint"
            >JPEG, PNG, WebP, or HEIC. You can also drop a file here.</span
          >
        </button>
      }

      <div class="frame-actions">
        <button
          type="button"
          class="button button--primary"
          (click)="download()"
          [disabled]="photo() === null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Download
        </button>
      </div>
      <div
        class="error"
        [class.is-pending]="errorMessage() === '' && pendingMessage() !== ''"
        aria-live="polite"
      >
        {{ errorMessage() || pendingMessage() }}
      </div>
    </div>
  </main>

  <input
    #fileInput
    id="photoFile"
    class="sr-only"
    type="file"
    accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"
    (change)="onFileSelected($event)"
  />
</div>
