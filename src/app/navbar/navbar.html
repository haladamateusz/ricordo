<header class="navbar">
  <h1 class="brand">
    <a routerLink="/" aria-current="page">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <g transform="rotate(10 16 16)">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M8.6 4.7H23.4A3.9 3.9 0 0 1 27.3 8.6V23.4A3.9 3.9 0 0 1 23.4 27.3H8.6A3.9 3.9 0 0 1 4.7 23.4V8.6A3.9 3.9 0 0 1 8.6 4.7ZM8.2 23.8V10.05A1.85 1.85 0 0 1 10.05 8.2H21.95A1.85 1.85 0 0 1 23.8 10.05V23.8L18.85 15.35 16.25 18.35 13.15 13.55Z"
          />
        </g>
      </svg>
      ricordo
    </a>
  </h1>
  <button
    #menuButton
    type="button"
    class="menu"
    aria-label="Open edits"
    aria-controls="edits-dialog"
    [attr.aria-expanded]="drawer.open()"
    (click)="drawer.show()"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 7h16M4 12h16M4 17h16"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>
